name: Lint

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      # Start with correctness-focused rules that the existing codebase satisfies.
      # Broader style rules can be enabled incrementally as legacy files are formatted.
      - name: Ruff correctness checks
        run: ruff check opk tests scripts --select E9,F63,F7,F82

      - name: Compile Python sources
        run: python -m compileall -q opk
