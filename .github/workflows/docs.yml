name: Documentation

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[docs]'
          pip install -r pdl-spec/requirements.txt

      - name: Update exact-generator-keys
        run: |
          python scripts/extract_generator_keys.py || true

      - name: Build main documentation
        run: mkdocs build --strict --site-dir site

      - name: Build PDL specification
        run: mkdocs build --strict --config-file pdl-spec/mkdocs.yml --site-dir ../site/pdl

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
